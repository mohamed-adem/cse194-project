name: Annual data downloads

on:
  workflow_dispatch:
  schedule:
    - cron: &dataset_01_qcew_cron '00 00 29 10 *' # dataset_01_quarterly_census_of_employment_and_wages Quarterly Census of Employment and Wages - October 30th
    - cron: &dataset_02_bea_county_personal_income_cron '00 00 6 2 *' # dataset_02_bea_county_personal_income, BEA - Personal income - Feburary 6th
    - cron: &dataset_03_county_median_household_income_cron '00 00 6 2 *' # dataset_03_county_median_household_income, Census SAIPE
    - cron: &dataset_04_county_median_listing_price_cron '00 00 5 * *' # dataset_04_county_median_listing_price Realtor
    - cron: &dataset_05_county_house_price_index_cron '00 00 16 8 *' # dataset_05_county_house_price_index, FHFA county house price index
    - cron: &dataset_06_zillow_county_home_value_index_cron '00 00 17 * *' # dataset_06_zillow_county_home_value_index, Zillow county ZHVI

permissions: {}

jobs:
  download:
    name: Download ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEA_SCHEDULE: *dataset_02_bea_county_personal_income_cron
      ZILLOW_SCHEDULE: *dataset_06_zillow_county_home_value_index_cron
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: dataset_01_qcew
            schedule: *dataset_01_qcew_cron
          - dataset: dataset_02_bea_county_personal_income
            schedule: *dataset_02_bea_county_personal_income_cron
            build_input: true
          - dataset: dataset_03_county_median_household_income
            schedule: *dataset_03_county_median_household_income_cron
          - dataset: dataset_04_county_median_listing_price
            schedule: *dataset_04_county_median_listing_price_cron
          - dataset: dataset_05_county_house_price_index
            schedule: *dataset_05_county_house_price_index_cron
          - dataset: dataset_06_zillow_county_home_value_index
            schedule: *dataset_06_zillow_county_home_value_index_cron
            build_input: true
    steps:
      - name: Download source files
        id: download
        # Refresh both inputs together so the build can use artifacts from this run.
        if: >-
          github.event_name == 'workflow_dispatch' ||
          matrix.schedule == github.event.schedule ||
          (matrix.build_input && (github.event.schedule == env.BEA_SCHEDULE ||
          github.event.schedule == env.ZILLOW_SCHEDULE))
        env:
          DATASET: ${{ matrix.dataset }}
        shell: bash
        run: |
          # Add one direct download URL per file to the dataset's urls array.
          declare -A output_names=()
          case "$DATASET" in
            dataset_01_qcew)
              urls=(
                "https://publish.data.ca.gov/dataset/3f08b68e-1d1a-4ba4-a07d-1ec3392ed191/resource/577beabf-3f53-4848-807f-adfd0551831c/download/qcew_2004-2007.csv"
                "https://publish.data.ca.gov/dataset/3f08b68e-1d1a-4ba4-a07d-1ec3392ed191/resource/0f196f1d-4447-479b-bef5-fb16a9093be9/download/qcew_2008-2011.csv"
                "https://publish.data.ca.gov/dataset/3f08b68e-1d1a-4ba4-a07d-1ec3392ed191/resource/51b27b21-bbd2-48ba-9f6d-997a282c5fce/download/qcew_2012-2015.csv"
                "https://publish.data.ca.gov/dataset/3f08b68e-1d1a-4ba4-a07d-1ec3392ed191/resource/78a9d6ee-ec9a-4c25-ae34-5bac44010cb2/download/qcew_2016-2019.csv"
                "https://publish.data.ca.gov/dataset/3f08b68e-1d1a-4ba4-a07d-1ec3392ed191/resource/ca165fad-4f16-48c7-808e-8b5222bc4182/download/qcew-2020-2022.csv"
                "https://publish.data.ca.gov/dataset/3f08b68e-1d1a-4ba4-a07d-1ec3392ed191/resource/119eef38-3b59-499f-8f7c-9bea4768469d/download/qcew-2023-2025q4.csv"
              )
              for url in "${urls[@]}"; do
                filename="${url##*/}"
                if [[ "$filename" =~ ^qcew[-_]([0-9]{4})-([0-9]{4})(q[1-4])?\.csv$ ]]; then
                  output_names["$url"]="Avg_Wage_County_${BASH_REMATCH[1]}_${BASH_REMATCH[2]}.csv"
                else
                  echo "::error::Cannot determine the year range for $filename"
                  exit 1
                fi
              done
              ;;
            dataset_02_bea_county_personal_income)
              # BEA publishes CAINC1 as a public ZIP of CSV files.
              urls=("https://apps.bea.gov/regional/zip/CAINC1.zip")
              output_names["${urls[0]}"]="CAINC1_CA_1969_2024.zip"
              ;;
            dataset_03_county_median_household_income)
              base_url="https://www2.census.gov/programs-surveys/saipe/datasets"
              archive_index=$(curl --fail --silent --show-error --location --retry 3 "$base_url/")
              years=$(printf '%s\n' "$archive_index" |
                sed -nE 's/.*href="([0-9]{4})\/".*/\1/p' | sort -u)
              urls=()
              for year in $years; do
                # Census published only state-level estimates for 1996.
                if [[ "$year" == 1996 ]]; then
                  continue
                fi
                release_url="$base_url/$year/$year-state-and-county"
                # Census used .dat through 2003 and .txt starting in 2004.
                extension=txt
                if (( year <= 2003 )); then
                  extension=dat
                fi
                filename="est${year:2}-ca.$extension"
                url="$release_url/$filename"
                urls+=("$url")
                output_names["$url"]="County_Median_Household_Income_${year}.$extension"
              done
              if (( ${#urls[@]} < 31 )); then
                echo "::error::The Census archive returned fewer than 31 county releases"
                exit 1
              fi
              ;;
            dataset_04_county_median_listing_price)
              urls=("https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_County_History.csv")
              output_names["${urls[0]}"]="Median_Average_Listing_House_Price.csv"
              ;;
            dataset_05_county_house_price_index)
              # The FHFA workbook contains the historical annual county series listed by FRED.
              urls=("https://www.fhfa.gov/hpi/download/annual/hpi_at_county.xlsx")
              output_names["${urls[0]}"]="House_Price_Change_Coun.xlsx"
              ;;
            dataset_06_zillow_county_home_value_index)
              # County ZHVI for mid-tier single-family homes and condos/co-ops.
              urls=("https://files.zillowstatic.com/research/public_csvs/zhvi/County_zhvi_uc_sfrcondo_tier_0.33_0.67_sm_sa_month.csv")
              output_names["${urls[0]}"]="Zillow_County_house.csv"
              ;;
            *) echo "::error::No download source configured for $DATASET"; exit 1 ;;
          esac

          if (( ${#urls[@]} == 0 )); then
            echo "::notice::Add direct download URLs for $DATASET to enable downloads"
            exit 0
          fi

          directory="direct_downloads/$DATASET"
          mkdir -p "$directory"
          for url in "${urls[@]}"; do
            url_path="${url%%[?#]*}"
            filename="${output_names[$url]:-${url_path##*/}}"
            if [[ -z "$filename" || "$filename" == "." || "$filename" == ".." || -e "$directory/$filename" ]]; then
              echo "::error::URL for $DATASET has a missing, invalid, or duplicate filename"
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 3 \
              --output "$directory/$filename" -- "$url"
          done

          echo "dataset=$DATASET" >> "$GITHUB_OUTPUT"

      - name: Save downloads as an artifact
        if: steps.download.outputs.dataset != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download.outputs.dataset }}-raw-data
          path: direct_downloads/
          if-no-files-found: error

  prepare-county-data:
    needs: download
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: county-data-${{ github.ref }}
      cancel-in-progress: false
    env:
      BEA_SCHEDULE: *dataset_02_bea_county_personal_income_cron
      ZILLOW_SCHEDULE: *dataset_06_zillow_county_home_value_index_cron
    steps:
      - uses: actions/checkout@v4
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == env.BEA_SCHEDULE || github.event.schedule == env.ZILLOW_SCHEDULE
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == env.BEA_SCHEDULE || github.event.schedule == env.ZILLOW_SCHEDULE
        with:
          pattern: dataset_0[26]_*-raw-data
          merge-multiple: true
          path: direct_downloads

      - name: Build and check county data
        id: build
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == env.BEA_SCHEDULE || github.event.schedule == env.ZILLOW_SCHEDULE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/stage_county_inputs.py --download-dir direct_downloads --raw-dir "$RUNNER_TEMP/county-inputs"
          python scripts/prepare_data.py --raw-dir "$RUNNER_TEMP/county-inputs" --output-dir "$RUNNER_TEMP/county-candidate"

          year=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          baseline = json.loads(Path("data/coverage.json").read_text())
          candidate_path = Path(os.environ["RUNNER_TEMP"]) / "county-candidate/coverage.json"
          candidate = json.loads(candidate_path.read_text())
          previous = max(baseline["allCountyYears"], default=0)
          latest = max(candidate["allCountyYears"], default=0)
          if latest > previous:
              print(latest)
          PY
          )
          if [[ -z "$year" ]]; then
            echo "::notice::The latest year with complete data for all 58 counties did not advance"
            exit 0
          fi

          artifact="county-data-through-$year"
          existing=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$artifact" --paginate \
            --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == env.GITHUB_REF_NAME) | .id')
          if [[ -n "$existing" ]]; then
            echo "::notice::County data through $year has already been uploaded"
            exit 0
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload updated county data
        if: steps.build.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ runner.temp }}/county-candidate/
          if-no-files-found: error
